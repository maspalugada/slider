<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import from Excel - CSSD SmartTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <h1>Import from Excel File</h1>
        <a href="{{ url_for('index') }}">Back to Dashboard</a>
    </div>

    <div class="container">
        <div class="action-form-container">
            <h2>Upload Excel File (.xlsx)</h2>
            <form method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="file">Select Excel File</label>
                    <input type="file" id="file" name="file" accept=".xlsx" required>
                </div>
                <button type="submit" class="action-button" style="background-color: #007bff;">Upload and Import</button>
            </form>
        </div>
        <div class="instructions action-form-container" style="margin-top: 2rem; background-color: #e9ecef;">
            <h4>Instructions</h4>
            <p>1. Ensure your Excel file has a single column containing the names of the instrument sets.</p>
            <p>2. The file must be in `.xlsx` format.</p>
            <p>3. The process will skip any set names that already exist in the database.</p>
        </div>
    </div>
</body>
</html>
